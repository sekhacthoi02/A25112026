<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"><meta name="theme-color" content="#000000"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="apple-touch-icon" href="./icon.png"><link rel="manifest" href="./manifest.json"><title>Video</title>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;width:100%;min-height:100%;background:#000}html{height:100%;height:100dvh}body{height:100%;height:100dvh;overflow:hidden}main{position:fixed;inset:0;width:100%;height:100%;height:100dvh;background:#000;display:flex;align-items:center;justify-content:center}video{display:block;width:100%;height:100%;height:100dvh;object-fit:contain;background:#000}#tap{position:absolute;inset:0;display:none;align-items:center;justify-content:center;border:0;background:rgba(0,0,0,.16);color:white;font:600 16px -apple-system,BlinkMacSystemFont,system-ui,sans-serif;cursor:pointer}#tap span{background:rgba(0,0,0,.78);border:1px solid #aaa;border-radius:999px;padding:14px 20px}#tap.visible{display:flex}#error{position:absolute;bottom:calc(22px + env(safe-area-inset-bottom));left:16px;right:16px;color:#fff;text-align:center;font:14px system-ui;display:none}#error.visible{display:block}

#avt{position:absolute;top:calc(12px + env(safe-area-inset-top));left:12px;width:52px;height:52px;object-fit:cover;border-radius:50%;border:2px solid rgba(255,255,255,.85);box-shadow:0 2px 12px #0008;z-index:4;pointer-events:none}
</style></head><body><main><img id="avt" src="./icon.png" alt="Ảnh đại diện"><video id="video" src="./video.mp4" poster="./poster.jpg" autoplay muted playsinline webkit-playsinline preload="auto" disablepictureinpicture controlslist="nodownload noremoteplayback"></video><button id="tap" type="button" aria-label="Phát video"><span>▶ Chạm để phát video</span></button><div id="error" role="alert">Không tải được video. Vui lòng tải lại trang hoặc mở bằng Safari.</div></main>
<script>
(()=>{const v=document.getElementById('video'),tap=document.getElementById('tap'),error=document.getElementById('error');let ended=false,attempting=false;
v.muted=true;v.defaultMuted=true;v.setAttribute('muted','');v.setAttribute('playsinline','');v.setAttribute('webkit-playsinline','');v.autoplay=true;
async function start(){if(ended||attempting||!v.paused)return;attempting=true;try{v.muted=true;await v.play();tap.classList.remove('visible');error.classList.remove('visible')}catch(e){if(!ended)tap.classList.add('visible')}finally{attempting=false}}
tap.addEventListener('click',()=>{start()});v.addEventListener('playing',()=>{tap.classList.remove('visible');error.classList.remove('visible')});v.addEventListener('ended',()=>{ended=true;tap.classList.remove('visible')});v.addEventListener('error',()=>{error.classList.add('visible');tap.classList.add('visible')});v.addEventListener('loadedmetadata',start);v.addEventListener('canplay',start);window.addEventListener('pageshow',start);document.addEventListener('visibilitychange',()=>{if(!document.hidden)start()});if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();
})();
</script></body></html>
